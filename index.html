<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor Estoque EAN-13</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; }
        #resultado { 
            margin-top: 20px; font-size: 1.2rem; font-weight: bold; 
            color: green; border: 2px solid #eee; padding: 10px; 
        }
        button {
            padding: 10px 20px; font-size: 1rem; margin-top: 10px;
            background-color: #007bff; color: white; border: none; border-radius: 5px;
        }
    </style>
</head>
<body>

    <h2>Contagem de Estoque</h2>
    <div id="reader"></div>
    <div id="resultado">Aguardando leitura...</div>
    <button onclick="reiniciar()">Ler Novamente</button>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const resultadoDiv = document.getElementById('resultado');
        
        // Configuração específica para melhorar performance
        const config = { 
            fps: 10, // Frames por segundo (não exagere para não esquentar o iPhone)
            qrbox: { width: 250, height: 150 }, // Área de foco (retangular para código de barras)
            aspectRatio: 1.0
        };

        function onScanSuccess(decodedText, decodedResult) {
            // Só processa se for um EAN-13 válido (13 números)
            if(decodedText.length === 13 && !isNaN(decodedText)){
                console.log(`Código lido: ${decodedText}`);
                resultadoDiv.innerText = `ITEM: ${decodedText}`;
                
                // Aqui você enviaria para seu banco de dados...
                
                // Pausa a câmera para não ler o mesmo item 50 vezes
                html5QrCode.pause(); 
                alert("Leitura confirmada: " + decodedText);
            }
        }

        function onScanFailure(error) {
            // Falhas são comuns enquanto a câmera procura, não precisa fazer nada
        }

        // Iniciar Câmera Traseira (environment)
        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess, 
            onScanFailure
        ).catch(err => {
            resultadoDiv.innerText = "Erro ao iniciar câmera: " + err;
        });

        function reiniciar(){
            resultadoDiv.innerText = "Aguardando...";
            html5QrCode.resume();
        }
    </script>
</body>
</html>
