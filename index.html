<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Estoque Manual</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 10px; background-color: #f4f4f4; }
        
        /* --- Câmera e Overlay --- */
        .camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            background: black;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #reader { width: 100%; }

        /* O Aviso Visual (HUD) - Agora com fundo sólido para leitura */
        #overlay-feedback {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            
            /* Inicialmente escondido */
            visibility: hidden; 
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            
            padding: 20px;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.85); /* Fundo escuro para destacar os botões */
            backdrop-filter: blur(5px); /* Borra o fundo da câmera */
        }

        #overlay-feedback.ativo {
            visibility: visible;
            opacity: 1;
            pointer-events: auto; /* Ativa o clique nos botões */
        }

        /* Textos do Overlay */
        .titulo-feedback { font-size: 1.5rem; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
        .nome-produto { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .fornecedor-produto { font-size: 1rem; font-style: italic; color: #ccc; margin-bottom: 15px; }
        .codigo-lido-overlay { font-size: 0.9rem; margin-bottom: 20px; color: #aaa; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; }

        /* Botões de Ação dentro da Câmera */
        .overlay-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .btn-overlay {
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .btn-confirmar { background-color: #28a745; color: white; box-shadow: 0 4px 0 #1e7e34; }
        .btn-confirmar:active { transform: translateY(4px); box-shadow: none; }

        .btn-cancelar { background-color: #dc3545; color: white; box-shadow: 0 4px 0 #bd2130; }
        .btn-cancelar:active { transform: translateY(4px); box-shadow: none; }

        /* Cores do Título baseadas no status */
        .status-sucesso { color: #28a745; }
        .status-erro { color: #dc3545; }

        /* --- Botões Principais --- */
        .btn-group { margin-top: 15px; display: flex; gap: 10px; justify-content: center; }
        button.main-btn { padding: 12px 20px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; flex: 1; color: white; font-weight: bold;}
        .btn-start { background-color: #007bff; }
        .btn-stop { background-color: #6c757d; }

        /* --- Histórico --- */
        #historico { 
            list-style: none; padding: 0; margin-top: 20px; text-align: left; 
            background: white; border-radius: 10px; overflow: hidden;
        }
        #historico li { 
            padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 0.95rem;
            display: flex; flex-direction: column;
        }
        #historico li span.hist-nome { font-weight: bold; color: #333; }
        #historico li span.hist-detalhe { font-size: 0.8rem; color: #666; display: flex; justify-content: space-between; margin-top: 4px; }
        
        .status-banco { margin-bottom: 10px; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

    <h2>📦 Estoque Manual</h2>
    <div class="status-banco" id="status-db">Carregando banco de dados...</div>
    
    <div class="camera-wrapper">
        <div id="reader"></div>
        
        <div id="overlay-feedback">
            <div class="titulo-feedback" id="txt-titulo">LIDO!</div>
            
            <div class="nome-produto" id="txt-nome">---</div>
            <div class="fornecedor-produto" id="txt-fornecedor">---</div>
            <div class="codigo-lido-overlay" id="txt-ean">EAN: ---</div>
            
            <div class="overlay-buttons">
                <button onclick="cancelarLeitura()" class="btn-overlay btn-cancelar">Cancelar ❌</button>
                <button onclick="confirmarLeitura()" class="btn-overlay btn-confirmar">CONFIRMAR ✅</button>
            </div>
        </div>
    </div>

    <div class="btn-group">
        <button onclick="iniciarLeitura()" class="main-btn btn-start">▶ Iniciar Câmera</button>
        <button onclick="pararLeitura()" class="main-btn btn-stop">⏹ Parar</button>
    </div>

    <h3>Histórico Confirmado</h3>
    <ul id="historico"></ul>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const overlay = document.getElementById('overlay-feedback');
        const txtTitulo = document.getElementById('txt-titulo');
        const txtNome = document.getElementById('txt-nome');
        const txtFornecedor = document.getElementById('txt-fornecedor');
        const txtEan = document.getElementById('txt-ean');
        const historicoEl = document.getElementById('historico');
        const statusDbEl = document.getElementById('status-db');
        
        let isScanning = false;
        let bancoDeDados = []; 
        
        // Variável temporária para guardar o que foi lido antes de confirmar
        let leituraPendente = null;

        // Carregar JSON
        fetch('./bancoprodutos.json')
            .then(response => {
                if (!response.ok) { throw new Error("Arquivo não encontrado"); }
                return response.json();
            })
            .then(data => {
                bancoDeDados = data;
                statusDbEl.innerText = `✅ Banco carregado: ${data.length} produtos.`;
                statusDbEl.style.color = "green";
            })
            .catch(error => {
                console.error('Erro ao carregar JSON:', error);
                statusDbEl.innerText = "❌ Erro: Não achei o arquivo 'bancoprodutos.json'.";
                statusDbEl.style.color = "red";
            });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function tocarBip(tipo) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if(tipo === 'sucesso') {
                oscillator.type = "square";
                oscillator.frequency.value = 660;
                gainNode.gain.value = 0.1;
                oscillator.start();
                setTimeout(() => { oscillator.stop(); }, 150);
            } else {
                oscillator.type = "sawtooth";
                oscillator.frequency.value = 200;
                gainNode.gain.value = 0.1;
                oscillator.start();
                setTimeout(() => { oscillator.stop(); }, 300);
            }
            if (navigator.vibrate) navigator.vibrate(200);
        }

        const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };

        function onScanSuccess(decodedText, decodedResult) {
            if(!isScanning) return;

            // 1. PAUSAR O SCANNER IMEDIATAMENTE
            html5QrCode.pause(true); 

            // 2. BUSCAR NO BANCO
            const produtoEncontrado = bancoDeDados.find(item => 
                item.ean === decodedText || 
                item.ean === "0" + decodedText || 
                "0" + item.ean === decodedText
            );

            // 3. PREPARAR OS DADOS PENDENTES (Mas não salvar no histórico ainda)
            if (produtoEncontrado) {
                tocarBip('sucesso');
                leituraPendente = {
                    nome: produtoEncontrado.nome,
                    fornecedor: produtoEncontrado.fornecedor,
                    ean: decodedText,
                    encontrado: true
                };
            } else {
                tocarBip('erro');
                leituraPendente = {
                    nome: "PRODUTO NÃO CADASTRADO",
                    fornecedor: "---",
                    ean: decodedText,
                    encontrado: false
                };
            }

            // 4. MOSTRAR O POPUP PARA O USUÁRIO DECIDIR
            abrirOverlayConfirmacao();
        }

        function abrirOverlayConfirmacao() {
            if(!leituraPendente) return;

            // Preenche os textos
            txtNome.innerText = leituraPendente.nome;
            txtFornecedor.innerText = leituraPendente.fornecedor;
            txtEan.innerText = `CÓD: ${leituraPendente.ean}`;

            if(leituraPendente.encontrado) {
                txtTitulo.innerText = "ENCONTRADO";
                txtTitulo.className = "titulo-feedback status-sucesso";
            } else {
                txtTitulo.innerText = "DESCONHECIDO";
                txtTitulo.className = "titulo-feedback status-erro";
            }

            // Mostra o overlay
            overlay.classList.add("ativo");
        }

        // --- AÇÃO: USUÁRIO CLICOU EM CONFIRMAR ---
        function confirmarLeitura() {
            if(leituraPendente) {
                // Agora sim adiciona ao histórico
                adicionarAoHistorico(leituraPendente.nome, leituraPendente.fornecedor, leituraPendente.ean);
                leituraPendente = null; // Limpa a pendência
            }
            
            fecharOverlayERetomar();
        }

        // --- AÇÃO: USUÁRIO CLICOU EM CANCELAR ---
        function cancelarLeitura() {
            console.log("Leitura cancelada pelo usuário");
            leituraPendente = null; // Descarta a leitura
            fecharOverlayERetomar();
        }

        function fecharOverlayERetomar() {
            overlay.classList.remove("ativo");
            
            // Pequeno delay para a animação terminar antes de ligar a câmera de novo
            setTimeout(() => {
                if(isScanning) html5QrCode.resume();
            }, 300);
        }

        function adicionarAoHistorico(nome, fornecedor, ean) {
            const li = document.createElement("li");
            const hora = new Date().toLocaleTimeString();
            
            // Ícone visual se foi cadastrado ou não
            const cor = nome === "PRODUTO NÃO CADASTRADO" ? "red" : "black";

            li.innerHTML = `
                <span class="hist-nome" style="color:${cor}">${nome}</span>
                <span class="hist-detalhe">
                    <span>${ean}</span>
                    <span>${hora}</span>
                </span>
            `;
            historicoEl.prepend(li);
        }

        function iniciarLeitura() {
            if(isScanning) return;
            isScanning = true;
            overlay.classList.remove("ativo"); // Garante que overlay comece fechado
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => alert("Erro: " + err));
        }

        function pararLeitura() {
            isScanning = false;
            html5QrCode.stop().then(() => console.log("Parado")).catch(err => console.log(err));
        }
    </script>
</body>
</html>
