<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor Estoque Visual</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 10px; background-color: #f4f4f4; }
        
        /* --- Container da Câmera e Overlay --- */
        .camera-wrapper {
            position: relative; /* Importante para posicionar o texto em cima */
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            background: black;
        }

        #reader { width: 100%; }

        /* O Aviso Visual (HUD) */
        #overlay-feedback {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; /* Cobre toda a câmera */
            background-color: rgba(40, 167, 69, 0.6); /* Verde translúcido */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: 900;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10; /* Garante que fique POR CIMA do vídeo */
            
            /* Estado inicial: invisível */
            opacity: 0; 
            pointer-events: none; /* Permite clicar através dele se precisar */
            transition: opacity 0.2s ease-in-out;
        }
        
        /* Classe para ativar o aviso */
        #overlay-feedback.ativo {
            opacity: 1;
        }

        .codigo-lido-overlay {
            font-size: 1.2rem;
            margin-top: 10px;
            font-weight: normal;
        }

        /* --- Resto do Estilo --- */
        .btn-group { margin-top: 15px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 20px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; flex: 1; color: white; font-weight: bold;}
        .btn-start { background-color: #007bff; }
        .btn-stop { background-color: #dc3545; }

        #historico { 
            list-style: none; padding: 0; margin-top: 20px; text-align: left; 
            background: white; border-radius: 10px; overflow: hidden;
        }
        #historico li { 
            padding: 10px 15px; border-bottom: 1px solid #eee; font-family: monospace; font-size: 1rem;
            display: flex; justify-content: space-between;
        }
        #historico li:first-child { background-color: #e8f5e9; font-weight: bold; color: green;}
    </style>
</head>
<body>

    <h2>📦 Leitor Rápido</h2>
    
    <div class="camera-wrapper">
        <div id="reader"></div>
        
        <div id="overlay-feedback">
            LIDO! ✅
            <div class="codigo-lido-overlay" id="txt-overlay">---</div>
        </div>
    </div>

    <div class="btn-group">
        <button onclick="iniciarLeitura()" class="btn-start">▶ Iniciar</button>
        <button onclick="pararLeitura()" class="btn-stop">⏹ Parar</button>
    </div>

    <h3>Histórico Recente</h3>
    <ul id="historico"></ul>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const overlay = document.getElementById('overlay-feedback');
        const txtOverlay = document.getElementById('txt-overlay');
        const historicoEl = document.getElementById('historico');
        let isScanning = false;

        // Configuração de Áudio (BIP)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function tocarBip() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = "square";
            oscillator.frequency.value = 660;
            gainNode.gain.value = 0.1;
            oscillator.start();
            setTimeout(() => { oscillator.stop(); }, 150);
            if (navigator.vibrate) navigator.vibrate(200);
        }

        const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };

        function onScanSuccess(decodedText, decodedResult) {
            if(!isScanning) return;

            console.log(`Lido: ${decodedText}`);
            
            // 1. Som
            tocarBip();

            // 2. Feedback VISUAL NA CÂMERA (Ativa o CSS)
            txtOverlay.innerText = decodedText;
            overlay.classList.add("ativo"); // Torna visível

            // 3. Adicionar ao Histórico
            const li = document.createElement("li");
            const hora = new Date().toLocaleTimeString();
            li.innerHTML = `<span>${decodedText}</span> <span>${hora}</span>`;
            historicoEl.prepend(li);

            // 4. Pausa técnica
            html5QrCode.pause(true); 

            // 5. Remove o feedback visual e retoma a leitura após 1.5s
            setTimeout(() => {
                overlay.classList.remove("ativo"); // Torna invisível de novo
                html5QrCode.resume();
            }, 1500);
        }

        function iniciarLeitura() {
            if(isScanning) return;
            isScanning = true;
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => alert("Erro: " + err));
        }

        function pararLeitura() {
            isScanning = false;
            html5QrCode.stop().then(() => {
                console.log("Parado");
            }).catch(err => console.log(err));
        }
    </script>
</body>
</html>
