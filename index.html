<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro (Estável)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 10px; background-color: #f4f4f4; margin: 0; }
        
        /* --- CONTROLE DE TELAS --- */
        .tela { display: none; } /* Esconde tudo por padrão */
        .tela.ativa { display: block; } /* Mostra só a ativa */

        /* --- ESTILO DO MENU E SELEÇÃO --- */
        .menu-box { background: white; padding: 20px; border-radius: 10px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-grande {
            display: block; width: 100%; padding: 20px; margin: 10px 0; font-size: 1.2rem; font-weight: bold;
            color: white; border: none; border-radius: 10px; cursor: pointer;
        }
        .btn-azul { background-color: #007bff; }
        .btn-verde { background-color: #28a745; }
        .btn-cinza { background-color: #6c757d; font-size: 1rem; padding: 10px; }

        select { width: 100%; padding: 15px; font-size: 1.1rem; margin: 15px 0; border-radius: 8px; border: 1px solid #ccc; background: #fff; }

        /* --- ESTILO DA CÂMERA (IGUAL AO ANTERIOR) --- */
        .camera-wrapper {
            position: relative; width: 100%; max-width: 500px; margin: 0 auto;
            border-radius: 10px; overflow: hidden; background: black;
        }
        #reader { width: 100%; }

        /* HUD / OVERLAY */
        #overlay-feedback {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 10; visibility: hidden; opacity: 0;
            background-color: rgba(0, 0, 0, 0.9); padding: 20px; box-sizing: border-box;
        }
        #overlay-feedback.ativo { visibility: visible; opacity: 1; pointer-events: auto; }

        .titulo-feedback { font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; }
        .nome-produto { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .overlay-buttons { display: flex; gap: 15px; width: 100%; margin-top: 20px; }
        .btn-overlay { padding: 15px; border: none; border-radius: 8px; font-weight: bold; flex: 1; font-size: 1rem; cursor: pointer;}
        .btn-confirmar { background: #28a745; color: white; }
        .btn-cancelar { background: #dc3545; color: white; }

        /* Painel de Contagem (Topo) */
        #painel-contagem {
            background: #333; color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px;
            display: none; /* Só aparece na contagem */
            justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

    <div id="tela-menu" class="tela ativa">
        <h2>📦 Controle de Estoque</h2>
        <div id="status-db" style="color: #666; margin-bottom: 10px;">Carregando banco...</div>
        
        <div class="menu-box">
            <button onclick="configurarModo('consulta')" class="btn-grande btn-azul">🔍 APENAS CONSULTAR</button>
            <hr>
            <label style="font-weight:bold; display:block; text-align:left;">Para Contagem, selecione:</label>
            <select id="select-produto">
                <option value="">Aguardando banco...</option>
            </select>
            <button onclick="configurarModo('contagem')" class="btn-grande btn-verde">🔢 INICIAR CONTAGEM</button>
        </div>
    </div>

    <div id="tela-camera" class="tela">
        <div id="painel-contagem">
            <span id="lbl-alvo" style="font-size: 0.9rem;">Produto Alvo</span>
            <span style="font-size: 1.5rem; font-weight: bold; color: #00ffea;" id="lbl-contador">0</span>
        </div>

        <div class="camera-wrapper">
            <div id="reader"></div>
            
            <div id="overlay-feedback">
                <div class="titulo-feedback" id="txt-titulo">LIDO!</div>
                <div class="nome-produto" id="txt-nome">---</div>
                <div style="color:#ccc; margin-bottom: 10px;" id="txt-detalhe">---</div>
                
                <div class="overlay-buttons">
                    <button onclick="acaoCancelar()" class="btn-overlay btn-cancelar" id="btn-cancelar">CANCELAR ❌</button>
                    <button onclick="acaoConfirmar()" class="btn-overlay btn-confirmar" id="btn-confirmar">CONFIRMAR ✅</button>
                </div>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button onclick="voltarParaMenu()" class="btn-cinza">⏹ Parar e Voltar</button>
        </div>
        
        <h3>Histórico da Sessão</h3>
        <ul id="historico" style="list-style:none; padding:0; text-align:left; background:white;"></ul>
    </div>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <script>
        // --- VARIÁVEIS GLOBAIS ---
        let html5QrCode = null;
        let bancoDeDados = [];
        let modoAtual = 'consulta'; // consulta ou contagem
        let produtoAlvo = null; // Objeto do produto selecionado para contagem
        let contagemAtual = 0;
        let leituraPendente = null; // Guarda o que foi lido enquanto espera confirmação

        // 1. CARREGAMENTO DO BANCO
        fetch('./bancoprodutos.json')
            .then(res => res.json())
            .then(data => {
                bancoDeDados = data;
                document.getElementById('status-db').innerText = `✅ ${data.length} produtos carregados.`;
                document.getElementById('status-db').style.color = "green";
                atualizarSelect();
            })
            .catch(err => {
                document.getElementById('status-db').innerText = "Erro ao carregar JSON.";
            });

        function atualizarSelect() {
            const sel = document.getElementById('select-produto');
            sel.innerHTML = '<option value="">-- Selecione para Contar --</option>';
            // Ordenar por nome
            bancoDeDados.sort((a,b) => a.nome.localeCompare(b.nome));
            bancoDeDados.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.ean;
                opt.innerText = p.nome;
                sel.appendChild(opt);
            });
        }

        // --- NAVEGAÇÃO SEGURA ---
        function configurarModo(modo) {
            modoAtual = modo;

            if (modo === 'contagem') {
                const ean = document.getElementById('select-produto').value;
                if (!ean) { alert("Selecione um produto na lista primeiro!"); return; }
                
                produtoAlvo = bancoDeDados.find(p => p.ean === ean);
                contagemAtual = 0;
                document.getElementById('lbl-alvo').innerText = produtoAlvo.nome;
                document.getElementById('lbl-contador').innerText = "0";
                document.getElementById('painel-contagem').style.display = 'flex';
            } else {
                document.getElementById('painel-contagem').style.display = 'none';
            }

            // Troca de tela
            document.getElementById('tela-menu').classList.remove('ativa');
            document.getElementById('tela-camera').classList.add('ativa');
            
            // Inicia Câmera
            iniciarCameraSegura();
        }

        function voltarParaMenu() {
            pararCamera();
            document.getElementById('tela-camera').classList.remove('ativa');
            document.getElementById('tela-menu').classList.add('ativa');
        }

        // --- CÂMERA (Igual ao código anterior) ---
        function iniciarCameraSegura() {
            // Garante que o div reader existe e está visível antes de chamar a biblioteca
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 150 } };
            
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => {
                alert("Erro ao iniciar câmera: " + err);
                voltarParaMenu();
            });
        }

        function pararCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                }).catch(err => console.log(err));
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Pausa imediatamente para não ler duplicado
            html5QrCode.pause(true);

            // Normalização (Zero a esquerda)
            let item = bancoDeDados.find(p => 
                p.ean === decodedText || p.ean === "0" + decodedText || "0" + p.ean === decodedText
            );

            // Lógica principal
            leituraPendente = {
                ean: decodedText,
                nome: item ? item.nome : "NÃO CADASTRADO",
                fornecedor: item ? item.fornecedor : "---",
                valido: !!item
            };

            // SE FOR CONTAGEM: Verifica se é o produto certo
            if (modoAtual === 'contagem') {
                verificarContagem(item, decodedText);
            } else {
                // SE FOR CONSULTA: Só mostra
                abrirOverlayConfirmacao(leituraPendente.nome, leituraPendente.fornecedor, true);
            }
        }

        function verificarContagem(itemEncontrado, codigoLido) {
            if (itemEncontrado && itemEncontrado.ean === produtoAlvo.ean) {
                // CORRETO
                tocarSom('sucesso');
                abrirOverlayConfirmacao(itemEncontrado.nome, "Produto Correto!", true);
            } else {
                // ERRADO
                tocarSom('erro');
                let msg = itemEncontrado ? `Você leu: ${itemEncontrado.nome}` : "Produto não cadastrado";
                abrirOverlayConfirmacao("ERRO DE PRODUTO", msg, false);
            }
        }

        // --- INTERFACE DO OVERLAY ---
        function abrirOverlayConfirmacao(titulo, subtitulo, isSucesso) {
            const ov = document.getElementById('overlay-feedback');
            const txtTit = document.getElementById('txt-titulo');
            const btnConf = document.getElementById('btn-confirmar');

            txtTit.innerText = titulo;
            document.getElementById('txt-nome').innerText = subtitulo;
            document.getElementById('txt-detalhe').innerText = isSucesso ? "" : "Cuidado: Produto divergente";

            // Ajuste de Cores
            if (isSucesso) {
                txtTit.style.color = "#28a745";
                btnConf.style.display = "inline-block"; // Mostra botão confirmar
                btnConf.innerText = modoAtual === 'contagem' ? "CONTAR +1" : "OK";
            } else {
                txtTit.style.color = "#dc3545";
                btnConf.style.display = "none"; // Esconde confirmar se for erro (só pode cancelar)
            }

            ov.classList.add('ativo');
        }

        function acaoConfirmar() {
            if (modoAtual === 'contagem') {
                contagemAtual++;
                document.getElementById('lbl-contador').innerText = contagemAtual;
                adicionarHistorico(`✅ (+1) ${leituraPendente.nome}`);
            } else {
                // Consulta
                adicionarHistorico(`🔍 ${leituraPendente.nome}`);
            }
            fecharOverlay();
        }

        function acaoCancelar() {
            fecharOverlay(); // Não soma nada, só fecha
        }

        function fecharOverlay() {
            document.getElementById('overlay-feedback').classList.remove('ativo');
            // Espera um pouquinho e retoma a câmera
            setTimeout(() => {
                html5QrCode.resume();
            }, 200);
        }

        function adicionarHistorico(texto) {
            const ul = document.getElementById('historico');
            const li = document.createElement('li');
            li.style.borderBottom = "1px solid #eee";
            li.style.padding = "10px";
            li.innerText = texto;
            ul.prepend(li);
        }

        // Som
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function tocarSom(tipo) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if(tipo === 'sucesso') {
                osc.type = "square"; osc.frequency.value = 660; gain.gain.value = 0.1;
                osc.start(); setTimeout(() => osc.stop(), 150);
            } else {
                osc.type = "sawtooth"; osc.frequency.value = 200; gain.gain.value = 0.1;
                osc.start(); setTimeout(() => osc.stop(), 300);
            }
            if (navigator.vibrate) navigator.vibrate(200);
        }
    </script>
</body>
</html>
